<div class="win wardrobe-win">
  <app-win-title label="wardrobe.dat — il mio armadio"></app-win-title>
  <div class="wardrobe-win__body">
    <dl class="stats">
      <div class="stat-card">
        <dt class="stat-card__label">salvati</dt>
        <dd class="stat-card__value stat-card__value--pink">{{ feed.savedCount() }}</dd>
      </div>
      <div class="stat-card">
        <dt class="stat-card__label">in saldo</dt>
        <dd class="stat-card__value stat-card__value--mint">{{ onSale() }}</dd>
      </div>
      <div class="stat-card">
        <dt class="stat-card__label">valore</dt>
        <dd class="stat-card__value stat-card__value--ink">€{{ total() }}</dd>
      </div>
    </dl>
  </div>
</div>

<!-- finestra salvati.lst -->
<div class="win saved-win">
  <app-win-title label="salvati.lst" [teal]="true"></app-win-title>
  <div class="saved-win__body">
    @if (feed.likedItems().length > 0) {
      <app-masonry>
        @for (it of feed.likedItems(); track it.id) {
          <app-feed-card [item]="it" [liked]="true" [showPriceDrop]="true" (open)="openItem($event)" (like)="feed.toggleLike($event)"></app-feed-card>
        }
      </app-masonry>
    } @else {
      <div class="saved-win__empty">
        <p class="saved-win__empty-title">L'armadio è vuoto</p>
        <p class="saved-win__empty-text">Tocca il cuore su un capo nel feed per salvarlo qui.</p>
        <a class="btn-95 btn-95--cta" routerLink="/feed">Vai al feed</a>
      </div>
    }
  </div>
</div>
