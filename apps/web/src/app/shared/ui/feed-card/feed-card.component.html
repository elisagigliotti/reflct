<article
  class="win win--pop card"
  [style.--rot]="item.rot + 'deg'"
  (click)="onOpen()"
  (keyup.enter)="onOpen()"
  tabindex="0"
  role="button"
  [attr.aria-label]="'Apri ' + item.name + ' in Prova'"
>
  <!-- mini title bar della card -->
  <div class="win-title card__title">
    <span class="win-title__label">{{ fileLabel }}</span>
    <span class="win-btns"><i class="card__title-close">×</i></span>
  </div>

  <!-- scatto prodotto (placeholder dithered) -->
  <app-shot [color]="item.shotColor" [height]="item.h"></app-shot>

  <!-- badge taglia + like sovrapposti -->
  @if (item.size) {
    <app-size-pill class="card__size" [size]="item.size"></app-size-pill>
  }
  <button
    type="button"
    class="card__like"
    [class.is-liked]="liked"
    [attr.aria-pressed]="liked"
    (click)="onLike($event)"
    [attr.aria-label]="likeLabel"
  >
    @for (t of [popTick]; track t) {
      <span class="card__heart" [class.is-popping]="t > 0">
        <app-pixel-icon [name]="liked ? 'heart' : 'heartEmpty'" [size]="18"></app-pixel-icon>
      </span>
    }
  </button>

  <!-- info capo -->
  <div class="card__info">
    <div class="card__name">{{ item.name }}</div>
    <div class="card__brand">{{ item.brand }}</div>

    <div class="card__price-row">
      <span class="card__price" [class.card__price--drop]="isDropped">{{ item.price }}</span>
      @if (isDropped) {
        <span class="card__old-price">{{ item.old }}</span>
      }
    </div>
    @if (isDropped) {
      <span class="stamp card__drop-stamp">▼ prezzo giù</span>
    }
    @if (item.fit) {
      <div class="card__fit">✓ {{ item.fit }}</div>
    }
  </div>
</article>
